<script>
/* 0.5.0: встроенный режим для iLife (раздел «Комиксы»): index.html?embed=ilife. Своё нижнее меню и логотип прячутся
   (страницы переключает меню iLife), цвета и шрифт берутся из темы iLife (тот же адрес сайта — страница читает их у родителя). */
(function(){
  if(!/[?&]embed=ilife\b/.test(location.search)||window.parent===window)return;
  var r=document.documentElement;r.dataset.embed='ilife';
  window.tsEmbedTheme=function(){
    try{
      var pd=parent.document.documentElement,cs=parent.getComputedStyle(pd),g=function(n){return cs.getPropertyValue(n).trim()};
      var map={'--bg':'--md-surface','--surface':'--md-container','--surface2':'--md-container-high','--ink':'--md-on-surface','--muted':'--md-on-variant',
        '--line':'--md-outline-variant','--edge':'--md-outline-variant','--accent':'--md-primary','--on-accent':'--md-on-primary','--ring':'--md-primary','--danger':'--md-error'};
      for(var k in map){var v=g(map[k]);if(v)r.style.setProperty(k,v)}
      r.style.setProperty('--hard','transparent');
      var f=parent.getComputedStyle(parent.document.body).fontFamily;if(f){r.style.setProperty('--f-body',f);r.style.setProperty('--f-display',f)}
      var dark=pd.dataset.mode==='dark';r.style.colorScheme=dark?'dark':'light';
    }catch(e){}
  };
  window.tsEmbedTheme();
})();
</script>
<style>
/* Layout: phone-first shell. Top bar, scrolling screen, view-options bar and a 4-tab menu pinned at the bottom.
   Comic page slides over the shell; the reader is a full-screen black stage. Ink outlines, hard offset shadows
   and halftone dots are the comic-print vocabulary; yellow is the single accent (Read button, active tab, stars). */
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --surface2:#E2E5EE; --ink:#14161D; --muted:#586073;
  --line:#CBD0DC; --edge:#14161D; --hard:#14161D; --accent:#FFC400; --on-accent:#14161D;
  --star:#F2A900; --danger:#B3202A; --dot:rgba(255,196,0,.8); --ring:#14161D; --scrim:rgba(14,16,24,.5);
  --f-display:'Yanone Kaffeesatz','Arial Narrow',Impact,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1016; --surface:#171A23; --surface2:#232736; --ink:#F1F2F7; --muted:#9BA2B6;
    --line:#2C3142; --edge:#4A5068; --hard:#000; --accent:#FFC400; --on-accent:#14161D;
    --star:#FFC400; --danger:#FF8A8A; --dot:rgba(255,196,0,.34); --ring:#FFC400; --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1016; --surface:#171A23; --surface2:#232736; --ink:#F1F2F7; --muted:#9BA2B6;
  --line:#2C3142; --edge:#4A5068; --hard:#000; --accent:#FFC400; --on-accent:#14161D;
  --star:#FFC400; --danger:#FF8A8A; --dot:rgba(255,196,0,.34); --ring:#FFC400; --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
img{display:block;max-width:100%}
h2,h3,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:24px;height:24px;flex:none}
.ic.on{fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut,.d{color:var(--muted);font-size:13px}

/* shell */
#app{position:relative;height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:1140px){#app{border-left:1.5px solid var(--line);border-right:1.5px solid var(--line)}}
#top .in{display:flex;align-items:center;gap:4px;padding-block:8px 2px}
.brand{margin-right:auto;min-width:0;font:700 26px/1 var(--f-display);letter-spacing:.03em;display:flex;align-items:center;white-space:nowrap}
.brand .bn{overflow:hidden;text-overflow:ellipsis}
.brand .ver{margin-left:8px;font:600 11px/1 var(--f-body);letter-spacing:.04em;padding:4px 7px;border-radius:9px;border:1.5px solid var(--edge);background:var(--surface);color:var(--ink);align-self:center;font-variant-numeric:tabular-nums}
.brand b{font-weight:700;background:var(--accent);color:var(--on-accent);padding:3px 7px 1px;border:1.5px solid var(--edge);border-radius:4px;transform:rotate(-3deg);box-shadow:2px 2px 0 var(--hard);margin-right:6px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:active{background:var(--surface2)}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.pad{padding-block:6px 28px}
.head{display:flex;align-items:flex-end;gap:12px;margin:2px 0 14px}
.head>div:first-child{min-width:0}
.head h2{font:700 42px/.9 var(--f-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.head .sub{font-size:13px;color:var(--muted);margin-top:5px}
.dots{flex:1;align-self:stretch;min-height:38px;background-image:radial-gradient(circle,var(--dot) 1.8px,transparent 2.3px);background-size:9px 9px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 75%);mask-image:linear-gradient(90deg,transparent,#000 75%)}

/* view options bar + menu */
#vbar{background:var(--surface);border-top:1.5px solid var(--line)}
#vbar .in{display:flex;align-items:center;gap:10px;padding-block:3px 2px}
#vbar .sl{flex:0 1 132px;min-width:84px}
#vbar .sp{flex:1}
#vbar.off .sl{opacity:.4}
.ticks{display:flex;justify-content:space-between;padding:0 7px;margin-top:0;font-size:9.5px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--surface2);border:1.5px solid var(--edge)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--surface2);border:1.5px solid var(--edge)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--accent);border:2px solid var(--edge);box-shadow:1px 1px 0 var(--hard)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--edge)}
.seg{display:flex;border:1.5px solid var(--edge);border-radius:12px;overflow:hidden;flex:none;background:var(--surface)}
.seg button{width:38px;height:32px;display:grid;place-items:center}
.seg button .ic{width:20px;height:20px}
.seg button+button{border-left:1.5px solid var(--edge)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.seg.wide{width:100%}
.seg.wide button{flex:1;width:auto;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;padding:0 8px;height:44px}
.seg.wide .ic{width:20px;height:20px}
#nav{background:var(--surface);border-top:1.5px solid var(--line)}
#nav .in{display:grid;grid-template-columns:repeat(4,1fr);padding-block:4px 2px}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11.5px;font-weight:500;color:var(--muted)}
#nav .pill{width:58px;height:30px;border-radius:15px;display:grid;place-items:center}
#nav button[aria-current=page]{color:var(--ink);font-weight:700}
#nav button[aria-current=page] .pill{background:var(--accent);color:var(--on-accent)}

/* covers & lists */
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:20px 14px}
.card{position:relative;display:block;min-width:0;text-align:left;cursor:pointer;width:100%;max-width:var(--fitW,none);justify-self:center}
.cover{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:5px;overflow:hidden;background:var(--surface2);border:1.5px solid var(--edge);box-shadow:3px 3px 0 var(--hard)}
.cover img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:5px;top:5px;font:700 9.5px/1 var(--f-body);letter-spacing:.07em;background:var(--accent);color:var(--on-accent);padding:3px 5px;border-radius:3px}
.fav{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(14,16,24,.78);color:#FFC400}
.fav .ic{width:14px;height:14px}
.card:active .cover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--hard)}
.meta{min-width:0}
.card .t{margin-top:9px;font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .a{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols3 .card .t{font-size:12.5px}
.cols4 .card .t{font-size:11.5px;margin-top:7px}
.cols3 .card .a,.cols4 .card .a{display:none}
.dgrid .card{align-content:start;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
.dgrid.cols1 .card{grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:16px}
.dgrid .card .t{margin-top:0}
.dgrid .card .a{white-space:normal}
.dgrid .desc{color:var(--muted);font-size:12.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.dgrid .mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:11px;color:var(--muted)}
.dgrid .mini span{background:var(--surface2);padding:2px 7px;border-radius:9px}
.dgrid.cols3 .desc,.dgrid.cols4 .desc{-webkit-line-clamp:4;font-size:11.5px}
.dgrid.cols1 .desc{-webkit-line-clamp:8;font-size:13.5px}
.dgrid.cols4 .mini{display:none}
.stars{display:inline-flex;gap:2px;color:var(--star)}
.stars .ic{width:16px;height:16px;stroke-width:1.8}
.stars.sm .ic{width:13px;height:13px}
.stars.big{gap:2px;margin-block:8px 2px}
.stars.big button{padding:3px;border-radius:8px;color:var(--star)}
.stars.big .ic{width:30px;height:30px}
.stars .ic:not(.on){color:var(--edge);opacity:.55}
.stars .ic.on{stroke:var(--edge);stroke-width:1.2}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--edge);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr[data-act]{cursor:pointer}
.tbl tbody tr:active{background:var(--surface2)}
.tbl td:nth-child(3),.tbl td:nth-child(4){font-variant-numeric:tabular-nums;white-space:nowrap}
.tc{position:relative;width:52px;padding-left:0!important}
.th{width:40px;aspect-ratio:2/3;object-fit:cover;border-radius:3px;border:1.5px solid var(--edge)}
.tc .fav{width:18px;height:18px;right:4px;top:4px}
.tc .fav .ic{width:10px;height:10px}
.empty{text-align:center;padding:44px 12px;color:var(--muted);display:grid;justify-items:center;gap:10px}
.empty .ic{width:44px;height:44px;color:var(--ink);opacity:.5}
.empty h3{font:700 26px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.empty p{max-width:34ch;font-size:14px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--edge);background:var(--surface);font-weight:600;font-size:14.5px}
.btn:active{background:var(--surface2)}
.btn .ic{width:20px;height:20px}
.btn.small{min-height:38px;padding:0 12px;font-size:13.5px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[aria-pressed=true] .ic{color:var(--danger)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:3px 3px 0 var(--hard);font:700 25px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;min-height:52px}
.btn.primary.small{font-size:20px;min-height:44px}
.btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--hard);background:var(--accent)}
.btn.primary .ic{width:22px;height:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.src{padding-bottom:14px}
.chip{flex:none;height:36px;padding:0 13px;border-radius:18px;border:1.5px solid var(--edge);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:600}
.chip[aria-pressed=true] small{color:var(--on-accent);opacity:.7}
.glabel{font:600 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.sfield{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border:1.5px solid var(--edge);border-radius:12px;background:var(--surface)}
.sfield input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;height:100%}
.sfield:focus-within{outline:3px solid var(--ring);outline-offset:2px}
.resbar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}
.resbar b{font-weight:600}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--edge);border-radius:10px;background:var(--bg);font-size:16px}
.field textarea{resize:vertical;min-height:96px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.group{background:var(--surface);border:1.5px solid var(--edge);border-radius:14px;padding:14px 16px 6px;margin-bottom:14px}
.group h3{font:700 22px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.row>div{min-width:0}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.row .k{font-weight:600}
.pad-s{padding:0 0 12px}
.about{text-align:center;margin-top:8px}

/* comic page */
#detail{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#detail .bar{display:flex;align-items:center;gap:6px;padding-block:8px 4px}
#detail .bt{flex:1;min-width:0;text-align:center;font:700 22px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#detail .scroll{flex:1;min-height:0;overflow-y:auto}
.hero{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:16px;align-items:start;margin-top:6px}
.hero .cover.big{box-shadow:4px 4px 0 var(--hard)}
.hinfo{min-width:0}
.hinfo h2{font:700 32px/.95 var(--f-display);letter-spacing:.01em;text-wrap:balance;overflow-wrap:break-word}
.by{color:var(--muted);margin-top:6px}
.actions{display:grid;gap:10px;margin-top:12px}
.resume{font-size:12.5px;color:var(--muted);margin-top:8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:20px}
.facts>div{padding:8px 0;border-top:1px solid var(--line);min-width:0}
.facts .w2{grid-column:1/-1}
.facts dt{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts dd{font-weight:500;margin-top:2px;overflow-wrap:anywhere}
.sec{font:700 24px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin:22px 0 8px}
.body{max-width:65ch;color:var(--ink)}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{padding:6px 12px;border-radius:999px;background:var(--surface2);font-size:13.5px;min-height:34px}
.tag:active{background:var(--accent);color:var(--on-accent)}
.chapters button{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border-top:1px solid var(--line);text-align:left}
.chapters li:last-child button{border-bottom:1px solid var(--line)}
.chapters .cn{flex:1;min-width:0;font-weight:500;display:flex;align-items:center;gap:8px}
.chapters .cp{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chapters .ic{width:18px;height:18px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);border:1.5px solid var(--edge);flex:none}
.dangerrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

/* sheet, search, toast */
#sheet{position:fixed;inset:0;z-index:150;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#sheetBody{width:min(100%,640px);max-height:92%;overflow-y:auto;background:var(--surface);border:1.5px solid var(--edge);border-bottom:0;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sh-h h3{font:700 28px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border:1.5px solid var(--edge);border-radius:12px;min-height:60px;width:100%}
a.opt{color:inherit;text-decoration:none}
.opt.pref{background:var(--accent);color:var(--on-accent);box-shadow:3px 3px 0 var(--hard)}
.opt span{display:grid;gap:1px;min-width:0}
.opt small{font-size:12.5px;opacity:.75}
.btnrow{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:8px}
.prog{height:12px;border:1.5px solid var(--edge);border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:10px}
.prog div{height:100%;width:0;background:var(--accent);transition:width .2s}
.dlist{margin-top:10px}
.dlist li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:4px 0}
.dopen{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;text-align:left}
.dopen span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#search{position:fixed;inset:0;z-index:140;background:var(--bg);overflow-y:auto}
#search .sin{max-width:1100px;margin:0 auto;min-height:100%;padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sbar{display:flex;align-items:center;gap:6px;padding-block:0 8px}
.sbar input{flex:1;min-width:0;height:48px;border:1.5px solid var(--edge);border-radius:12px;background:var(--surface);padding:0 14px;font-size:16px}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 0;border-top:1px solid var(--line);text-align:left}
.srow span{flex:1;min-width:0;display:grid}
.srow small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow>.ic:last-child{width:18px;height:18px;color:var(--muted)}
.srow .th{width:36px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:300;max-width:min(92vw,520px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* reader (always a black stage, independent of the app theme) */

#rrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:560px;margin:0 auto}
#rrow button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:500;color:#fff;border-radius:12px}

#reader input[type=range]::-webkit-slider-thumb{border-color:#14161D;box-shadow:none}

/* adaptive scale: --vh is the real height of the scrolling area (set by script); at "1 per row" a whole cover fits on screen */

.dgrid.cols1 .card{max-width:none;grid-template-columns:minmax(0,min(38%,var(--fitW,60%))) minmax(0,1fr)}

/* folders (tiles use the same 2:3 proportion as covers) */
.ftile{position:relative;container-type:inline-size;aspect-ratio:2/3;width:100%;border-radius:5px;background:var(--fc,#FFC400);color:var(--fk,#14161D);border:1.5px solid var(--edge);box-shadow:3px 3px 0 var(--hard);display:grid;place-items:center;overflow:hidden}

/* ───────── library storage: IndexedDB v2 (comics, pages, folders), in-memory fallback ───────── */
const DB=(()=>{
  let db=null,ok=false,blocked=false;
  const mem={comics:new Map(),pages:new Map(),folders:new Map()};
  const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const done=tx=>new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});
  const clone=v=>JSON.parse(JSON.stringify(v));
  return{
    get ok(){return ok},
    get blocked(){return blocked&&!ok},      /* an older tab still holds the database open, so the 0.1.0 → 0.2.0 upgrade is waiting */
    async init(){
      try{
        if(!window.indexedDB)throw 0;
        db=await new Promise((res,rej)=>{
          const o=indexedDB.open('mycomic',2);
          o.onupgradeneeded=()=>{
            const d=o.result;
            if(!d.objectStoreNames.contains('comics'))d.createObjectStore('comics',{keyPath:'id'});
            if(!d.objectStoreNames.contains('pages'))d.createObjectStore('pages');
            if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id'});
          };
          o.onsuccess=()=>res(o.result);o.onerror=()=>rej(o.error);o.onblocked=()=>{blocked=true};
        });
        db.onversionchange=()=>{try{db.close()}catch{}ok=false;location.reload()};   /* a newer version is opening elsewhere */
        ok=true;
      }catch{ok=false}
      return ok;
    },
    async all(){
      if(!ok)return[...mem.comics.values()];
      try{return await req(db.transaction('comics').objectStore('comics').getAll())}catch{return[]}
    },
    async allFolders(){
      if(!ok)return[...mem.folders.values()];
      try{return await req(db.transaction('folders').objectStore('folders').getAll())}catch{return[]}
    },
    async save(c){
      const copy=clone(c);
      if(!ok){mem.comics.set(c.id,copy);return}
      try{const tx=db.transaction('comics','readwrite');tx.objectStore('comics').put(copy);await done(tx)}catch{}
    },
    async saveFolder(f){
      const copy=clone(f);
      if(!ok){mem.folders.set(f.id,copy);return}
      try{const tx=db.transaction('folders','readwrite');tx.objectStore('folders').put(copy);await done(tx)}catch{}
    },
    async delFolder(id){
      if(!ok){mem.folders.delete(id);return}
      try{const tx=db.transaction('folders','readwrite');tx.objectStore('folders').delete(id);await done(tx)}catch{}
    },
    async del(id){
      if(!ok){mem.comics.delete(id);for(const k of[...mem.pages.keys()])if(k.startsWith(id+'|'))mem.pages.delete(k);return}
      try{
        const tx=db.transaction(['comics','pages'],'readwrite');
        tx.objectStore('comics').delete(id);
        tx.objectStore('pages').delete(IDBKeyRange.bound(id+'|',id+'|\uffff'));
        await done(tx);
      }catch{}
    },
    async putPage(key,blob){
      if(!ok){mem.pages.set(key,blob);return}
      const tx=db.transaction('pages','readwrite');tx.objectStore('pages').put(blob,key);await done(tx);
    },
    async getPage(key){
      if(!ok)return mem.pages.get(key);
      try{return await req(db.transaction('pages').objectStore('pages').get(key))}catch{return undefined}
    }
  };
})();

function buildChapters(items,strip){

  for(const it of items){const k=it.rel.slice(0,-1).join('/');(groups.get(k)||groups.set(k,[]).get(k)).push(it)}
  const keys=[...groups.keys()].sort(natural);

    title:k?prettify(k.split('/').pop()).replace(strip?/^\d{1,3} - /:/^$/,''):`Глава ${i+1}`,

function planFiles(files){
  const imgs=[],jobs=[],rar=[];
  for(const f of files){
    const p=f.webkitRelativePath||f.name,segs=p.split('/'),name=lastOf(segs);
    if(name.startsWith('.')||segs.includes('__MACOSX'))continue;
    if(IMG_RE.test(name))imgs.push({segs,ref:f});
    else if(ARC_RE.test(name))jobs.push({kind:'zip',file:f});
    else if(RAR_RE.test(name))rar.push(name);
  }
  if(imgs.length){
    const roots=new Set(imgs.map(i=>i.segs[0])),hasRoot=imgs.every(i=>i.segs.length>1)&&roots.size===1;
    const rootName=hasRoot?imgs[0].segs[0]:null;
    const rows=imgs.map(i=>({rel:hasRoot?i.segs.slice(1):i.segs,ref:i.ref}));
    if(rows.some(r=>r.rel.length===1)){
      jobs.push({kind:'folder',title:rootName?prettify(rootName):guessTitle(rows.map(r=>r.rel[0])),items:rows});
    }else{
      const tops=[...new Set(rows.map(r=>r.rel[0]))];
      if(tops.length>1&&tops.every(t=>CH_RE.test(t)))jobs.push({kind:'folder',title:rootName?prettify(rootName):'Новый комикс',items:rows});
      else for(const t of tops)jobs.push({kind:'folder',title:prettify(t),items:rows.filter(r=>r.rel[0]===t).map(r=>({rel:r.rel.slice(1),ref:r.ref}))});

const GJS='https://accounts.google.com/gsi/client';
const DAPI='https://www.googleapis.com/drive/v3/files';

const GSCOPE='https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file openid email profile';

function loadGis(){

    const old=document.querySelector('script[data-gis]');if(old){old.addEventListener('load',()=>res());old.addEventListener('error',()=>rej(new Error('blocked')));return}
    const s=document.createElement('script');s.src=GJS;s.async=true;s.dataset.gis='1';
    const t=setTimeout(()=>rej(new Error('timeout')),8000);
    s.onload=()=>{clearTimeout(t);res()};s.onerror=()=>{clearTimeout(t);rej(new Error('blocked'))};

/* the optional «bridge» is a small Cloudflare Worker (folder worker/): it fetches pages and files for the browser and keeps the Google refresh key */

let tokWait=null;
function askToken(prompt){
  return new Promise((res,rej)=>{
    const w={t:setTimeout(()=>{if(tokWait===w)tokWait=null;rej(new Error('timeout'))},20000)};
    w.ok=v=>{clearTimeout(w.t);res(v)};w.fail=e=>{clearTimeout(w.t);rej(e)};
    tokWait=w;

      if(!drive.client)drive.client=google.accounts.oauth2.initTokenClient({
        client_id:prefs.clientId,scope:GSCOPE,
        callback:r=>{const q=tokWait;tokWait=null;if(r.error)q&&q.fail(new Error(r.error));else{setToken(r.access_token,r.expires_in);q&&q.ok(r.access_token)}},

      });

async function bridgeJson(path,body){
  const r=await fetch(proxyBase()+path,{method:'POST',headers:Object.assign({'content-type':'application/json'},proxyHeaders()),body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));

/* one in-flight request at a time. Order: stored token → refresh key (bridge) → silent Google sign-in (prompt none) */
let tokP=null;
function ensureToken(interactive){
  if(tokenOk())return Promise.resolve(drive.token);
  if(tokP)return tokP;
  tokP=(async()=>{
    try{
      if(proxyOn()&&prefs.gRefresh){
        try{return await refreshViaBridge()}catch(e){if(e.code==='invalid_grant'){prefs.gRefresh='';savePrefs()}}
      }
      if(!prefs.clientId)throw new Error('Не указан Client ID.');

    }finally{tokP=null}

/* permanent sign-in through the bridge: the Worker exchanges the one-time code and stores the client secret, the browser keeps only the refresh key */
async function bridgeConnect(){

async function driveFetch(url,opts={}){

/* ───────── sync between devices through Google Drive ─────────

     _state.json   folders, deleted items, reading settings                 _progress.json   reading place of every comic + the last one
   Newer wins: comics and folders compare their change time (mt), the reading place compares its own time. Deleted items are remembered as marks. */
const SYNC_FIELDS=['title','author','year','genre','country','age','translation','desc','tags','rating','fav','cover','coverSrc','coverTried','chapters','source','cloud','added','folder','ffolder','srcUrl','license','driveIds','mt'];
const metaOf=c=>{const o={id:c.id};for(const k of SYNC_FIELDS)if(c[k]!==undefined)o[k]=c[k];return o};
const MAX_SYNC_BYTES=700*1048576;

const tomb=(kind,id)=>{prefs.deleted[kind+':'+id]=Date.now();savePrefs();Sync.kick()};
const Sync=(()=>{

    return prefs.lastSync?`Синхронизировано в ${when(prefs.lastSync)}. Комиксов: ${n}.`:'Ещё не синхронизировалось.';
  }
  function paint(){
    const b=$('#syncBtn');
    if(b){b.hidden=!driveReady();b.dataset.s=on()?ST.state:'off';b.title=statusText()}
    $$('.syncst').forEach(e=>{e.textContent=statusText();e.classList.toggle('err',on()&&(ST.state==='err'||ST.state==='need'))});
    const si=$('#sgin');if(si)si.hidden=!(on()&&ST.state==='need');

  function multipart(meta,body,type){

    return{type:`multipart/related; boundary=${b}`,body:new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${type}\r\n\r\n`,body,`\r\n--${b}--`])};
  }
  async function putJson(name,obj,props,id,keepalive){

    return r.json();
  }
  async function putBlob(name,blob,props,id){
    const meta={name,mimeType:'application/zip',appProperties:props||{}};if(!id)meta.parents=[fid];
    const r0=await driveFetch(`${UPL}${id?'/'+id:''}?uploadType=resumable&fields=${FILEF}`,{method:id?'PATCH':'POST',
      headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':'application/zip','X-Upload-Content-Length':String(blob.size)},body:JSON.stringify(meta)});

  async function listFolder(){

    if(fid)return fid;

  /* ----- folders, deleted items, reading settings ----- */

  async function syncState(by){
    let changed=false;
    const sf=by.get('_state.json');
    let rs=null;if(sf){try{rs=await getJson(sf.id)}catch(e){if(e.status)throw e}}
    rs=rs||{folders:[],deleted:{},set:null,setT:0};
    const del=Object.assign({},rs.deleted||{});
    for(const[k,v]of Object.entries(prefs.deleted||{}))del[k]=Math.max(del[k]||0,v);
    const cut=Date.now()-365*864e5;for(const k of Object.keys(del))if(del[k]<cut)delete del[k];

    for(const r of[...(rs.folders||[])].sort((a,b)=>depth(a)-depth(b))){

            const cb=by.get(id+'.cbz');if(!cb)continue;                       /* the pages have not arrived on the Drive yet */
            setSt('busy',`Скачиваю «${meta.title||id}»…`);
            const blob=await getBlob(cb.id);
            await importZip(new File([blob],id+'.cbz'),{id,noCover:true,bg:true});
            const c=byId(id);if(!c)continue;
            applyMeta(c,meta);await DB.save(c);
          }
          toast(`С другого устройства: «${meta.title||'комикс'}»`,2600);
        }else{applyMeta(l,meta);await DB.save(l)}
        changed=true;
      }catch(e){if(e.status===401||e.status===403)throw e;ST.fails.push(`${f.name}: ${e.message||e}`);console.warn(e)}
    }
    return changed;
  }
  async function pushComics(by){
    for(const c of comics.filter(x=>x.source!=='demo')){
      if(prefs.deleted['c:'+c.id])continue;
      const jf=by.get(c.id+'.json'),rmt=jf?(+(jf.appProperties&&jf.appProperties.mt)||Date.parse(jf.modifiedTime)||0):-1;
      const needCbz=c.source!=='drive'&&!by.has(c.id+'.cbz');
      if(!needCbz&&jf&&(c.mt||0)<=rmt)continue;
      try{
        if(needCbz){
          setSt('busy',`Отправляю «${c.title}»…`);
          const blob=await buildCbz(c,p=>setSt('busy',`Отправляю «${c.title}» — ${Math.round(p*100)}%`));
          if(blob.size>MAX_SYNC_BYTES)throw new Error('слишком большой для синхронизации (больше 700 МБ)');
          by.set(c.id+'.cbz',await putBlob(c.id+'.cbz',blob,{cid:c.id}));
        }
        if(!c.mt)c.mt=c.added||Date.now();
        const r=await putJson(c.id+'.json',metaOf(c),{mt:String(c.mt)},jf&&jf.id);
        by.set(c.id+'.json',r);
      }catch(e){if(e.status===401||e.status===403)throw e;ST.fails.push(`«${c.title}»: ${e.message||e}`);console.warn(e)}
    }
  }

  /* ----- reading place ----- */
  async function syncProgress(by){
    const pf=by.get('_progress.json');
    let rp={p:{},last:null};
    if(pf){progFile=pf.id;try{rp=(await getJson(pf.id))||rp}catch(e){if(e.status)throw e}}
    const merged={p:{},last:null};let local=false,dirty=false;
    const ids=new Set([...Object.keys(rp.p||{}),...comics.map(c=>c.id)]);
    for(const id of ids){
      if(prefs.deleted['c:'+id])continue;
      const r=rp.p&&rp.p[id],c=byId(id),l=c&&c.progress&&c.progress.t?[c.progress.c,c.progress.p,c.progress.t]:null;
      if(r&&(!l||r[2]>l[2])){
        merged.p[id]=r;
        if(c&&!(R.c&&R.c.id===id)){c.progress={c:r[0],p:r[1],t:r[2]};await DB.save(c);local=true}
      }else if(l){merged.p[id]=l;if(!r||l[2]>r[2])dirty=true}
    }
    const a=rp.last,b=prefs.last;
    merged.last=a&&(!b||a.t>b.t)?a:b||null;
    if(merged.last&&(!b||merged.last.t>b.t)){prefs.last=merged.last;savePrefs();local=true}
    if(merged.last&&(!a||merged.last.t>a.t))dirty=true;
    if(dirty||!pf){const r=await putJson('_progress.json',merged,{},pf&&pf.id);progFile=r.id;by.set('_progress.json',r)}
    progDirty=false;
    return local;
  }
  async function pushProgress(){
    if(!on()||!progDirty||running||!tokenOk())return;
    try{
      await ensureFolder();
      const f=progFile?{id:progFile,name:'_progress.json'}:await findFile('_progress.json');
      const by=new Map();if(f)by.set('_progress.json',f);
      if(await syncProgress(by))refreshUI();
    }catch{/* the next full sync repeats it */}
  }

  /* ----- the whole run ----- */
  async function run(){
    if(!on()||(navigator.onLine===false))return;
    if(running){again=true;return}
    running=true;again=false;ST.fails=[];
    let changed=false;
    try{
      setSt('busy','Подключаюсь к Google Диску…');
      try{await ensureToken(false)}catch{setSt('need');armGestureAuth();return}
      await ensureFolder();
      setSt('busy','Читаю список файлов…');
      const by=new Map((await listFolder()).map(f=>[f.name,f]));
      changed=await syncState(by)||changed;
      changed=await pullComics(by)||changed;
      await pushComics(by);
      changed=await syncProgress(by)||changed;
      prefs.lastSync=Date.now();savePrefs();
      setSt(ST.fails.length?'err':'ok',ST.fails.length?`не удалось: ${ST.fails.slice(0,2).join('; ')}`:'');
    }catch(e){
      console.warn(e);
      if(e.status===401||e.status===403){dropToken();setSt('need');armGestureAuth()}
      else setSt('err',e.message||'сбой связи');
    }finally{
      running=false;
      if(changed)refreshUI();
      if(again){again=false;kick(1500)}
    }
  }
  function kick(ms=2500){if(!on())return;clearTimeout(timer);timer=setTimeout(run,ms)}
  function progress(flushNow){
    if(!on())return;progDirty=true;
    if(running){again=true;return}
    clearTimeout(progTimer);progTimer=setTimeout(pushProgress,flushNow?300:20000);
  }
  return{kick,now:()=>{clearTimeout(timer);return run()},progress,flush:()=>{if(progDirty){clearTimeout(progTimer);pushProgress()}},
    need:()=>setSt('need'),paint,statusText,on,get busy(){return running},get kind(){return ST.state}};

})();

/* ───────── covers from the internet: found by the comic's title when it is loaded for the first time ─────────
   Sources (all answer browsers directly): AniList, Kitsu, Open Library, Wikipedia. Every candidate is scored against the title,
   a weak match is never used. The picture is stored in the library (so it also works offline); if a server forbids reading it
   (CORS), the address is kept and the own first-page cover stays as a fallback. A cover set by hand is never replaced. */
function coverQuery(t){
  return String(t||'').replace(/\.[a-z0-9]{2,4}$/i,'')
    .replace(/[\[\(\{][^\]\)\}]*[\]\)\}]/g,' ')
    .replace(/[_.]+/g,' ')
    .replace(/(?:^|\s)(?:vol(?:ume)?|v|ch(?:apter)?|ep(?:isode)?|том|глава|гл|выпуск|серия|#)\s*\.?\s*\d+[\w.-]*/gi,' ')
    .replace(/\b(?:digital|scanlation|webrip|hq)\b/gi,' ')
    .replace(/\s+/g,' ').trim();
}
const wordsOf=s=>norm(s).replace(/[^\p{L}\p{N}]+/gu,' ').split(' ').filter(Boolean);
/* 0…1: how well one of the candidate titles matches the wanted one */
function titleScore(q,cands){
  const a=wordsOf(q);if(!a.length)return 0;
  const sa=new Set(a);let best=0;
  for(const t of cands){
    const b=wordsOf(String(t||'').replace(/\((?:manga|manhwa|manhua|comic|comics|graphic novel|webtoon|series)\)/gi,' '));if(!b.length)continue;
    const sb=new Set(b);let i=0;for(const w of sa)if(sb.has(w))i++;
    let sc=i/(sa.size+sb.size-i);
    if(i===sa.size&&sb.size<=sa.size+3)sc=Math.max(sc,.8);         /* every word of the title is there, the candidate adds only a little */
    if(a.join(' ')===b.join(' '))sc=1;
    best=Math.max(best,sc);
  }
  return best;
}
const jget=async(url,opts,ms=7000)=>{
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(url,Object.assign({signal:ac.signal},opts));if(!r.ok)throw new Error('http '+r.status);return await r.json()}
  finally{clearTimeout(t)}
};
const COVER_SOURCES=[
  ['AniList',async q=>{
    const j=await jget('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({query:'query($s:String){Page(perPage:6){media(search:$s,type:MANGA){title{romaji english native} synonyms coverImage{extraLarge large}}}}',variables:{s:q}})});
    return((j.data&&j.data.Page&&j.data.Page.media)||[]).map(m=>({url:m.coverImage&&(m.coverImage.extraLarge||m.coverImage.large),titles:[m.title&&m.title.romaji,m.title&&m.title.english,m.title&&m.title.native,...(m.synonyms||[])].filter(Boolean)}));
  }],
  ['Kitsu',async q=>{
    const j=await jget(`https://kitsu.io/api/edge/manga?filter%5Btext%5D=${encodeURIComponent(q)}&page%5Blimit%5D=6`,{headers:{Accept:'application/vnd.api+json'}});
    return(j.data||[]).map(d=>{const a=d.attributes||{};return{url:a.posterImage&&(a.posterImage.large||a.posterImage.medium||a.posterImage.original),titles:[a.canonicalTitle,...Object.values(a.titles||{}),...(a.abbreviatedTitles||[])].filter(Boolean)}});
  }],
  ['Open Library',async q=>{
    const j=await jget(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8&fields=title,cover_i`);
    return(j.docs||[]).filter(d=>d.cover_i).map(d=>({url:`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`,titles:[d.title]}));
  }],
  ['Wikipedia',async q=>{
    const j=await jget(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${encodeURIComponent(q+' comic OR manga OR manhwa OR webtoon')}&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=500`);
    return Object.values((j.query&&j.query.pages)||{}).filter(p=>p.thumbnail&&p.thumbnail.source).map(p=>({url:p.thumbnail.source,titles:[p.title]}));
  }]
];
/* all sources at once; result: candidates with a score, best first */
async function findCovers(title){
  const q=coverQuery(title)||String(title||'').trim();
  if(!q)return[];
  const res=await Promise.allSettled(COVER_SOURCES.map(([name,fn],ix)=>fn(q).then(l=>l.filter(x=>x.url&&/^https:/i.test(x.url)).map(x=>({url:x.url,src:name,ix,title:x.titles[0]||'',score:titleScore(q,x.titles)})))));
  if(res.every(r=>r.status==='rejected'))throw new Error('нет связи с сервисами обложек');   /* offline: not «nothing found», so the search is repeated later */
  const out=[];for(const r of res)if(r.status==='fulfilled')out.push(...r.value);
  const seen=new Set();
  return out.filter(x=>!seen.has(x.url)&&seen.add(x.url)).sort((a,b)=>b.score-a.score||a.ix-b.ix);
}
/* the picture itself as a small stored thumbnail; null when the server does not let the page read it */
async function coverFromUrl(url){
  try{
    const r=await fetch(url,{mode:'cors'});if(!r.ok)throw 0;
    const b=await r.blob();if(!/^image\//.test(b.type)||b.size>8e6)throw 0;
    return await makeCover(b,300,450,.84);
  }catch{return null}
}
async function applyCover(c,url,how){
  let val=await coverFromUrl(url),remote=false;
  if(!val){val=url;remote=true}
  if(c.cover&&!/^https?:/i.test(c.cover))c.cover0=c.cover;
  c.cover=val;c.coverSrc=how;c.coverTried=true;
  await persist(c);
  return remote;
}
const MIN_AUTO_SCORE=.6;
const CoverQ={ids:[],busy:false};
function queueAutoCover(c){
  if(!prefs.autoCover||!c||c.source==='demo'||c.coverSrc||c.coverTried)return;
  if(!c.coverWait){c.coverWait=true;DB.save(c)}                   /* remembered, so a search that failed offline is repeated at the next start */
  if(!CoverQ.ids.includes(c.id))CoverQ.ids.push(c.id);
  if(!CoverQ.busy)runCoverQ();
}
async function runCoverQ(){
  CoverQ.busy=true;
  while(CoverQ.ids.length){
    const c=byId(CoverQ.ids.shift());
    if(!c||c.coverSrc||c.coverTried||!prefs.autoCover)continue;
    try{
      const l=await findCovers(c.title),best=l[0];
      c.coverWait=false;
      if(best&&best.score>=MIN_AUTO_SCORE){await applyCover(c,best.url,'auto');refreshUI()}
      else{c.coverTried=true;await persistQuiet(c)}
    }catch(e){c.coverWait=true;console.warn('cover',e)}
    await wait(900);
  }
  CoverQ.busy=false;
}
/* only comics whose search could not finish (offline) are retried; the existing library is never touched */
function scanCovers(){for(const c of comics)if(c.coverWait)queueAutoCover(c)}

  openSheet(`<div class="sh-h"><h3>Синхронизация</h3><button class="ib" data-act="sclose" aria-label="Закрыть">${ic('close')}</button></div>
    <p class="stline syncst"></p>
    <div class="opts">
      ${driveReady()?`<button class="opt pref" id="sgin" data-act="gsignin"${Sync.kind==='need'?'':' hidden'}>${ic('user')}<span><b>Войти в Google</b><small>Подтвердить вход, это нужно только один раз</small></span></button>`:''}
      <button class="opt" data-act="syncnow">${ic('refresh')}<span><b>Синхронизировать сейчас</b><small>Обычно это происходит само, в фоне</small></span></button>
      <button class="opt" data-act="gotoprefs">${ic('sliders')}<span><b>Настройки синхронизации</b><small>Включить, выключить, мост для постоянного входа</small></span></button>
    </div>`);

}
function syncNowUI(){
  if(!driveReady()){closeSheet();toast('Сначала подключите аккаунт Google в Настройках',3200);go('#prefs');return}
  Sync.now();toast('Синхронизирую…',1500);
}
async function signInNow(){
  try{await ensureToken(true);closeSheet();toast('Вход выполнен',1800);Sync.now()}
  catch(e){toast(e.message==='blocked'||e.message==='timeout'?'Вход Google не открылся. Откройте My_topsecret на своём сайте.':'Не удалось войти: '+(e.message||'ошибка'),5000)}
}

/* ───────── start of the background work ───────── */
let loginHinted=false;
function startBackground(){
  loadToken();Sync.paint();
  if(driveReady()){
    loadGis().catch(()=>{});
    ensureToken(false).then(()=>Sync.kick(600)).catch(()=>{
      Sync.need();armGestureAuth();
      if(!loginHinted){loginHinted=true;toast('Нужно подтвердить вход в Google: нажмите на облако вверху.',5000)}
    });
  }
  scanCovers();
  setTimeout(tgBackground,1500);
  setInterval(()=>{if(!document.hidden)Sync.kick(0)},180000);
  setInterval(tgBackground,60000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)Sync.flush();else{Sync.kick(400);tgBackground()}});
  window.addEventListener('online',()=>{Sync.kick(500);tgBackground();scanCovers()});
}

const rateHTML=c=>`<div class="stars big" role="group" aria-label="Ваша оценка">${[1,2,3,4,5].map(i=>`<button data-act="rate" data-id="${c.id}" data-n="${i}" aria-label="${i} из 5" aria-pressed="${c.rating===i}">${ic('star',i<=c.rating?'on':'')}</button>`).join('')}</div>`;
const coverHTML=(c,cls='')=>`<div class="cover ${cls}"><img src="${esc(c.cover)}" alt="" decoding="async" referrerpolicy="no-referrer"${fbAttr(c)}>${c.source==='demo'?'<span class="badge">ПРИМЕР</span>':''}${c.fav?`<span class="fav">${ic('heart','on')}</span>`:''}</div>`;
const cntText=n=>`${n} ${pl(n,'комикс','комикса','комиксов')}`;
const isSel=(t,id)=>!!S.sel&&S.sel.has(t+':'+id);
const selMark=()=>`<span class="selmark" aria-hidden="true">${ic('check')}</span>`;
const selAttr=(t,id)=>S.sel?` aria-selected="${isSel(t,id)}"`:'';

function cardHTML(c){
  const v=prefs.view,d=v==='detailed';
  return `<article class="card" data-act="${S.sel?'seltog':'open'}" data-t="c" data-id="${c.id}" tabindex="0" role="button" title="${esc(c.title)}" aria-label="${esc(c.title)}"${selAttr('c',c.id)}>
    ${coverHTML(c)}${S.sel?selMark():''}
    ${v==='icons'?'':`<div class="meta"><div class="t">${esc(c.title)}</div>
      <div class="a">${esc(c.author||'Автор не указан')}${c.year?' · '+esc(c.year):''}</div>
      ${d?`${starsHTML(c.rating,'sm')}<p class="desc">${esc(c.desc||'Описание пока не добавлено.')}</p><div class="mini">${hashtags(c).slice(0,4).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
    </div>`}</article>`;
}
const folderInfo=f=>{const sub=childFolders(f.id,f.scope).length;return(sub?`${sub} ${pl(sub,'папка','папки','папок')}, `:'')+cntText(countIn(f))};
function folderDesc(f){
  const subs=childFolders(f.id,f.scope).map(x=>x.name);
  const list=sorted(comics.filter(c=>f.scope==='fav'?(c.fav&&c.ffolder===f.id):c.folder===f.id)).map(c=>c.title);
  const parts=[];
  if(subs.length)parts.push('Папки: '+subs.slice(0,5).join(', ')+(subs.length>5?'…':''));
  if(list.length)parts.push('Комиксы: '+list.slice(0,5).join(', ')+(list.length>5?'…':''));
  return parts.join('. ')||'Папка пока пустая.';
}
const folderTile=f=>{const col=okColor(f.color);return `<div class="ftile" style="--fc:${col};--fk:${textOn(col)}"><span class="ftab"></span><span class="femo" aria-hidden="true">${esc(f.emoji||'📁')}</span><span class="fcnt">${countIn(f)}</span></div>`};
function folderCard(f){
  const v=prefs.view;
  return `<article class="card folder" data-act="${S.sel?'seltog':'cd'}" data-t="f" data-id="${f.id}" data-scope="${f.scope}" tabindex="0" role="button" title="${esc(f.name)}" aria-label="Папка ${esc(f.name)}"${selAttr('f',f.id)}>
    ${folderTile(f)}${S.sel?selMark():''}
    <div class="meta"><div class="t">${esc(f.name)}</div>${v==='icons'?'':`<div class="a">${esc(folderInfo(f))}</div>`}${v==='detailed'?`<p class="desc">${esc(folderDesc(f))}</p>`:''}</div></article>`;
}
function listHTML(d){
  const v=prefs.view,n=prefs.cols;
  if(v==='table'){
    const frows=d.folders.map(f=>{const col=okColor(f.color);
      return `<tr data-act="${S.sel?'seltog':'cd'}" data-t="f" data-id="${f.id}" data-scope="${f.scope}" tabindex="0"${selAttr('f',f.id)}><td class="tc"><span class="fico" style="--fc:${col};--fk:${textOn(col)}">${esc(f.emoji||'📁')}</span></td><td><b>${esc(f.name)}</b><br><span class="mut">${esc(folderInfo(f))}</span></td><td>—</td><td>—</td><td></td></tr>`}).join('');
    const crows=d.comics.map(c=>`<tr data-act="${S.sel?'seltog':'open'}" data-t="c" data-id="${c.id}" tabindex="0"${selAttr('c',c.id)}><td class="tc"><img class="th" src="${esc(c.cover)}" alt="" referrerpolicy="no-referrer"${fbAttr(c)}>${c.fav?`<span class="fav">${ic('heart','on')}</span>`:''}</td><td><b>${esc(c.title)}</b><br><span class="mut">${esc(c.author||'—')}</span></td><td>${esc(c.year||'—')}</td><td>${pagesOf(c)}</td><td>${starsHTML(c.rating,'sm')}</td></tr>`).join('');
    return`<div class="tblwrap"><table class="tbl"><thead><tr><th scope="col"><span class="sr">Обложка</span></th><th scope="col">Название</th><th scope="col">Год</th><th scope="col">Стр.</th><th scope="col">Оценка</th></tr></thead><tbody>${frows}${crows}</tbody></table></div>`;
  }
  return`<div class="grid v-${v} ${v==='detailed'?'dgrid':''} cols${n}" style="--cols:${n}">${d.folders.map(folderCard).join('')}${d.comics.map(cardHTML).join('')}</div>`;
}
function arm(el,key,label,fn){
  if(S.arm===key){S.arm=null;clearTimeout(el._t);fn();return}
  S.arm=key;el.dataset.orig=el.innerHTML;el.textContent=label;
  clearTimeout(el._t);el._t=setTimeout(()=>{if(S.arm===key)S.arm=null;if(el.isConnected&&el.dataset.orig)el.innerHTML=el.dataset.orig},4000);
}

/* ───────── categories: search + facets ───────── */
const GROUPS=[['genre','Жанр'],['country','Страна выпуска'],['age','Цензура'],['translation','Перевод'],['year','Год издания'],['author','Автор'],['rating','Оценка пользователя']];
const FIELDS=[['all','Везде'],['title','Название'],['author','Автор'],['genre','Жанр'],['age','Цензура'],['country','Страна'],['translation','Перевод'],['year','Год'],['rating','Оценка']];
const RATING_CHIPS=[[5,'5 ★'],[4,'от 4 ★'],[3,'от 3 ★'],[2,'от 2 ★'],[1,'от 1 ★'],[0,'без оценки']];
const resetFacets=()=>{S.q.facets=Object.fromEntries(GROUPS.map(([g])=>[g,new Set()]))};
resetFacets();
const fieldText=(c,f)=>f==='genre'?c.genre.join(' '):f==='rating'?String(c.rating):String(c[f]??'');
function catMatch(c){
  const{field,text,facets}=S.q;
  if(text.trim()){
    const toks=norm(text).split(/\s+/).filter(Boolean),tags=hashtags(c).map(norm);
    const hay=norm(field==='all'?[c.title,c.author,c.genre.join(' '),c.age,c.country,c.translation,c.year,c.desc,tags.join(' ')].join(' '):fieldText(c,field));
    for(const t of toks){if(t.startsWith('#')){if(!tags.some(x=>x.startsWith(t)))return false}else if(!hay.includes(t))return false}
  }
  for(const[g,set]of Object.entries(facets)){
    if(!set.size)continue;
    if(g==='rating'){if(![...set].some(v=>v===0?c.rating===0:c.rating>=v))return false;continue}
    const vals=(g==='genre'?c.genre:[g==='year'?String(c.year||''):c[g]]).map(String);
    if(![...set].some(v=>vals.includes(v)))return false;
  }
  return true;
}
function facetCounts(g){
  const m=new Map();
  for(const c of comics)for(const v of(g==='genre'?c.genre:[g==='year'?String(c.year||''):c[g]]))if(v)m.set(String(v),(m.get(String(v))||0)+1);
  const cmp=g==='year'?(a,b)=>b[0]-a[0]:g==='age'?(a,b)=>AGES.indexOf(a[0])-AGES.indexOf(b[0]):(a,b)=>coll.compare(a[0],b[0]);
  return[...m].sort(cmp);
}
const anyFilter=()=>S.q.text.trim()||Object.values(S.q.facets).some(s=>s.size);
function catHTML(){
  const chips=GROUPS.map(([g,label])=>{
    const set=S.q.facets[g];
    const items=g==='rating'?RATING_CHIPS.map(([v,l])=>[v,l,comics.filter(c=>v===0?c.rating===0:c.rating>=v).length]).filter(x=>x[2]||set.has(x[0])):facetCounts(g).map(([v,n])=>[v,v,n]);
    if(!items.length)return'';
    return`<div class="glabel">${label}</div><div class="chips">${items.map(([v,l,n])=>`<button class="chip" data-act="chip" data-g="${g}" data-v="${esc(v)}" aria-pressed="${set.has(v)}">${esc(l)} <small>${n}</small></button>`).join('')}</div>`;
  }).join('');
  return`<div class="gut pad"><div class="head"><div><h2>Категории</h2><div class="sub">Поиск по автору, названию, жанру и другим полям</div></div><div class="dots"></div></div>
    <label class="sfield">${ic('search')}<input id="qText" type="search" placeholder="Что искать? Например: фантастика или #север" autocomplete="off" value="${esc(S.q.text)}"></label>
    <div class="glabel">Искать по</div>
    <div class="chips">${FIELDS.map(([v,l])=>`<button class="chip" data-act="qfield" data-v="${v}" aria-pressed="${S.q.field===v}">${l}</button>`).join('')}</div>
    ${chips}
    <div class="resbar"><b id="cnt"></b><button class="btn small" data-act="qreset" id="qreset">Сбросить</button></div>
    <div id="lh"></div></div>`;
}

/* folder tools above the list: path, new folder, edit current folder, multi-select */
function toolsHTML(scope){
  const cur=S.cur[scope],path=pathOf(cur);
  const crumbs=[`<button class="crumb" data-act="cd" data-scope="${scope}" data-id=""${!cur?' aria-current="page"':''}>${ic(scope==='fav'?'heart':'books')}<span>${scope==='fav'?'Всё избранное':'Всё'}</span></button>`]
    .concat(path.map(f=>`<span class="sep" aria-hidden="true">›</span><button class="crumb" data-act="cd" data-scope="${scope}" data-id="${f.id}"${f.id===cur?' aria-current="page"':''}><span class="ce">${esc(f.emoji||'📁')}</span><span>${esc(f.name)}</span></button>`));
  return`<nav class="crumbs" aria-label="Путь">${crumbs.join('')}</nav>
    <div class="tools">
    ${cur?`<button class="btn small sq" data-act="efolder" data-id="${cur}" aria-label="Изменить папку" title="Изменить папку">${ic('edit')}</button>`:''}
    <button class="btn small" data-act="newfolder" data-scope="${scope}">${ic('folderplus')} Папка</button>
    <button class="btn small" data-act="selmode" aria-pressed="${!!S.sel}">${ic('check')} Выбрать</button></div>`;
}
function scopeData(scope){
  let cur=S.cur[scope];
  const f=folderById(cur);if(!f||f.scope!==scope)cur=S.cur[scope]=null;
  const fl=childFolders(cur,scope);
  const cl=scope==='storage'
    ?comics.filter(c=>folderOf(c,'storage')===cur&&(S.src==='all'||(S.src==='cloud')===isCloud(c)))
    :comics.filter(c=>c.fav&&folderOf(c,'fav')===cur);
  return{cur,folders:fl,comics:sorted(cl)};
}
function emptyFor(sc,d){
  if(sc==='fav'){
    if(d.cur)return`<div class="empty">${ic('folder')}<h3>Папка пуста</h3><p>Добавьте сюда избранное: «Выбрать» → «Переместить» или кнопка «Переместить» на странице комикса.</p></div>`;
    return`<div class="empty">${ic('heart')}<h3>Избранных пока нет</h3><p>Откройте комикс и нажмите «В избранное», он появится здесь. Папки для избранного создаются кнопкой «Папка».</p><button class="btn" data-act="tab" data-tab="storage">Открыть Хранилище</button></div>`;
  }
  if(d.cur)return`<div class="empty">${ic('folder')}<h3>Папка пуста</h3><p>Добавьте сюда комиксы или переместите их через «Выбрать».</p><button class="btn" data-act="add">${ic('plus')} Добавить</button></div>`;
  return comics.length?`<div class="empty">${ic('cloud')}<h3>В этом источнике пусто</h3><p>Переключите фильтр выше или добавьте комиксы.</p><button class="btn" data-act="add">${ic('plus')} Добавить</button></div>`
    :`<div class="empty">${ic('books')}<h3>Библиотека пуста</h3><p>Добавьте папку или архив CBZ с устройства, подключите Google Диск или найдите комикс в интернете.</p><button class="btn primary" data-act="add">${ic('plus')} Добавить комиксы</button></div>`;
}
function fillList(){
  const h=$('#lh');if(!h)return;
  let count;
  if(S.tab==='categories'){
    const l=sorted(comics.filter(catMatch));
    h.innerHTML=l.length?listHTML({folders:[],comics:l}):`<div class="empty">${ic('search')}<h3>Ничего не найдено</h3><p>Попробуйте убрать часть фильтров или изменить запрос.</p><button class="btn" data-act="qreset">Сбросить фильтры</button></div>`;
    count=`Найдено: ${l.length}`;
  }else{
    const sc=scopeOfTab(),d=scopeData(sc),t=$('#tools');
    if(t){t.innerHTML=toolsHTML(sc);const cr=$('.crumbs',t);if(cr)cr.scrollLeft=cr.scrollWidth}
    h.innerHTML=(d.folders.length||d.comics.length)?listHTML(d):emptyFor(sc,d);
    count=cntText(d.comics.length)+(d.folders.length?` · ${d.folders.length} ${pl(d.folders.length,'папка','папки','папок')}`:'');
  }
  const c=$('#cnt');if(c)c.textContent=count;
  const r=$('#qreset');if(r)r.hidden=!anyFilter();
  syncSel();
}
function syncSel(){
  const bar=$('#selbar');if(!bar)return;

function openSearch(){const s=$('#search');s.hidden=false;$('#sq').value='';runSearch('');setTimeout(()=>$('#sq').focus(),40)}
function closeSearch(){$('#search').hidden=true}
function setTheme(t){prefs.theme=t;savePrefs();applyTheme();if(S.tab==='prefs'&&$('#detail').hidden)renderTab(true);toast(t==='dark'?'Тёмная тема':'Светлая тема')}
function runSearch(qs){
  const q=norm(qs),box=$('#sres');
  const utils=UTILS.map((u,i)=>({u,i})).filter(({u})=>(!u.show||u.show())&&(!q||norm(u.t+' '+u.k+' '+u.h).includes(q)));
  const found=q?sorted(comics.filter(c=>{
    const hay=norm([c.title,c.author,c.genre.join(' '),c.country,c.translation,c.age,c.year,c.desc,hashtags(c).join(' ')].join(' '));
    return q.split(/\s+/).every(t=>hay.includes(t));
  })).slice(0,30):[];
  const fl=q?folders.filter(f=>norm(f.name).includes(q)).sort((a,b)=>coll.compare(a.name,b.name)).slice(0,10):[];
  let html='';
  if(fl.length)html+=`<div class="glabel">Папки</div>`+fl.map(f=>`<button class="srow" data-act="sfolder" data-id="${f.id}" data-scope="${f.scope}"><span class="fico" style="--fc:${okColor(f.color)};--fk:${textOn(okColor(f.color))}">${esc(f.emoji||'📁')}</span><span><b>${esc(f.name)}</b><small>${f.scope==='fav'?'Избранное':'Хранилище'} · ${esc(folderInfo(f))}</small></span>${ic('fwd')}</button>`).join('');
  if(found.length)html+=`<div class="glabel">Комиксы</div>`+found.map(c=>`<button class="srow" data-act="sopen" data-id="${c.id}"><img class="th" src="${esc(c.cover)}" alt="" referrerpolicy="no-referrer"${fbAttr(c)}><span><b>${esc(c.title)}</b><small>${esc(c.author||'Автор не указан')}${c.year?' · '+esc(c.year):''}</small></span>${ic('fwd')}</button>`).join('');
  if(utils.length)html+=`<div class="glabel">${q?'Разделы и настройки':'Быстрые действия'}</div>`+utils.map(({u,i})=>`<button class="srow" data-act="sutil" data-n="${i}">${ic(u.i)}<span><b>${esc(u.t)}</b><small>${esc(u.h)}</small></span>${ic('fwd')}</button>`).join('');
  if(!html)html=`<div class="empty">${ic('search')}<h3>Ничего не найдено</h3><p>Попробуйте автора, название, жанр или слово из настроек.</p></div>`;
  box.innerHTML=html;
}

/* ───────── clicks ───────── */
function act(a,el,ev){
  if(a.startsWith('rd-'))return readerAct(a,ev);
  const id=el.dataset.id,c=id?byId(id):null,v=el.dataset.v;
  switch(a){
    case'tab':go('#'+el.dataset.tab);break;
    case'reload':location.reload();break;
    case'search':openSearch();break;
    case'add':addSheet();break;
    case'open':go('#comic-'+id);break;
    case'back':back('storage');break;
    case'fav':if(c){c.fav=!c.fav;persist(c);refreshDetail();toast(c.fav?'Добавлено в избранное':'Убрано из избранного',1600)}break;
    case'rate':if(c){const n=+el.dataset.n;c.rating=c.rating===n?0:n;persist(c);refreshDetail()}break;
    case'read':if(c){tryFs();go('#read-'+id)}break;
    case'readch':if(c){c.progress={c:+el.dataset.ci,p:0,t:Date.now()};prefs.last={id:c.id,t:c.progress.t};savePrefs();persistQuiet(c);Sync.progress();tryFs();go('#read-'+id)}break;
    case'edit':if(c)editSheet(c);break;
    case'ecover':$('#fCover').click();break;
    case'del':if(c)arm(el,'del'+id,'Нажмите ещё раз, чтобы удалить',()=>doDelete(c));break;
    case'sclose':if(!$('#sheet').dataset.lock)closeSheet();break;
    case'view':prefs.view=v;savePrefs();syncVbar();fillList();break;
    case'src':S.src=v;renderTab(true);break;
    case'chip':{const g=el.dataset.g,val=g==='rating'?Number(v):v,set=S.q.facets[g];if(set.has(val))set.delete(val);else set.add(val);el.setAttribute('aria-pressed',String(set.has(val)));fillList();break}
    case'qfield':S.q.field=v;$$('[data-act=qfield]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));fillList();break;
    case'qreset':S.q.text='';S.q.field='all';resetFacets();renderTab(true);break;
    case'tagq':resetFacets();S.q.text=v;S.q.field='all';go('#categories');break;
    case'theme':setTheme(v);break;
    case'store':prefs.storage=v;savePrefs();renderTab(true);break;
    case'rtl':prefs.rtl=v==='rtl';prefs.setT=Date.now();savePrefs();Sync.kick();renderTab(true);break;
    case'gconnect':driveConnect();break;
    case'gdisc':driveDisconnect();break;
    case'export':exportXlsx();break;
    case'exportall':exportAll();break;
    case'rmdemo':rmDemos();break;
    case'clearall':arm(el,'clear','Точно очистить?',clearAll);break;
    case'addfolder':$('#fFolder').click();break;
    case'addfiles':$('#fFiles').click();break;
    case'adddrive':driveOpen();break;
    case'dup':drive.stack.pop();driveBrowse();break;
    case'dcd':drive.stack.push({id:el.dataset.id,name:el.dataset.n});driveBrowse();break;
    case'dimport':driveImport(el.dataset.id,el.dataset.n);break;
    case'dzip':driveZip(el.dataset.id,el.dataset.n);break;
    case'sclose2':closeSearch();break;
    case'sopen':closeSearch();go('#comic-'+id);break;
    case'sfolder':closeSearch();S.cur[el.dataset.scope]=id;go(el.dataset.scope==='fav'?'#home':'#storage');break;

    case'moveto':moveTo(id||null);break;
    case'cmove':if(c)moveSheet(['c:'+id],'storage');break;
    case'cmovefav':if(c)moveSheet(['c:'+id],'fav');break;

      savePrefs();

      if(k==='tgAuto'&&prefs.tgAuto)tgBackground();

      Sync.paint();if(S.tab==='prefs')renderTab(true);break}
    case'covfind':if(c)coverPicker(c);break;
    case'cvpick':coverPick(+el.dataset.n);break;
    case'bback':{const B=S.web.b;if(B.i>0){B.i--;browse(B.hist[B.i],false)}break}
    case'bfwd':{const B=S.web.b;if(B.i<B.hist.length-1){B.i++;browse(B.hist[B.i],false)}break}

    case'bjs':S.web.b.js=!S.web.b.js;syncBrowserBar();if(S.web.b.url)browse(S.web.b.url,false);break;

/* ───────── reader: full-screen pages, swipe, pinch, loupe up to ×50, fit-to-width, bottom menu ───────── */
const R={c:null,ci:0,pi:0,s:1,z:1,tx:0,ty:0,ui:false,tok:0};
const ZMAX=50,ZLOG=Math.log(ZMAX);
const rd=$('#reader'),img=$('#pageImg'),stage=$('#stage');
const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let progT;
const saveProgressSoon=c=>{clearTimeout(progT);progT=setTimeout(()=>persistQuiet(c),600)};
function setUI(v){R.ui=v;rd.dataset.ui=v?'on':'off';if(!v){$('#bpanel').hidden=true;$('#zpanel').hidden=true}syncRowState()}
function applyBright(){$('#dim').style.opacity=String((100-prefs.bright)/100*.9);$('#bright').value=prefs.bright}

/* Scale 1 = the whole page fits inside the screen. With «по ширине» the page is widened until it touches both side edges;
   its top and bottom may then go beyond the screen and are scrolled. R.s is the real scale; the loupe value is R.s / baseScale(). */
function baseScale(){
  if(!prefs.fitW)return 1;
  const W=stage.clientWidth,H=stage.clientHeight,nw=img.naturalWidth,nh=img.naturalHeight;
  if(!nw||!nh||!W||!H)return 1;
  return Math.max(1,(W*nh)/(H*nw));
}
const zoomOf=()=>R.s/baseScale();
/* the page is drawn "contain" inside the stage; pan limits follow the drawn picture */
function drawn(){
  const W=stage.clientWidth,H=stage.clientHeight,nw=img.naturalWidth,nh=img.naturalHeight;
  if(!nw||!nh)return{w:W,h:H};
  const k=Math.min(W/nw,H/nh);return{w:nw*k,h:nh*k};
}
function bounds(){const W=stage.clientWidth,H=stage.clientHeight,d=drawn(),w=d.w*R.s,h=d.h*R.s;return{mx:Math.max(0,(w-W)/2),my:Math.max(0,(h-H)/2)}}
const zLabel=z=>'×'+(z<9.95?z.toFixed(1).replace(/\.0$/,''):String(Math.round(z)));
function syncRowState(){
  const z=zoomOf();
  const f=$('[data-act=rd-fit]'),l=$('[data-act=rd-zoom]');
  if(f)f.setAttribute('aria-pressed',String(!!prefs.fitW));
  if(l)l.setAttribute('aria-pressed',String(z>1.02||!$('#zpanel').hidden));
}
function syncZoomUI(){
  const z=zoomOf(),zr=$('#zoomr'),zv=$('#zval');
  if(zr)zr.value=String(Math.round(Math.log(clamp(z,1,ZMAX))/ZLOG*1000));
  if(zv)zv.textContent=zLabel(z);
  syncRowState();
}
function applyT(extraX=0){
  const b=bounds();R.tx=clamp(R.tx,-b.mx,b.mx);R.ty=clamp(R.ty,-b.my,b.my);
  img.style.transform=R.s===1&&!R.tx&&!R.ty&&!extraX?'':`translate(${R.tx+extraX}px,${R.ty}px) scale(${R.s})`;
  R.z=zoomOf();syncZoomUI();
}
/* show the whole page at its base size; edge says which end of a tall page is shown first */
function viewReset(edge='top'){
  R.s=baseScale();R.tx=0;R.ty=0;img.style.transition='';
  const b=bounds();R.ty=edge==='bottom'?-b.my:b.my;
  applyT();
}
function zoomTo(s2,fx,fy,anim){
  const base=baseScale(),s1=R.s;
  s2=clamp(s2,base,base*ZMAX);
  R.tx=fx-(fx-R.tx)*s2/s1;R.ty=fy-(fy-R.ty)*s2/s1;R.s=s2;
  if(s2<=base*1.001){R.s=base;R.tx=0}
  img.style.transition=anim&&!reduceMotion()?'transform .22s ease':'';applyT();
  if(anim)setTimeout(()=>{img.style.transition=''},240);
}
const setZoom=(z,anim)=>zoomTo(baseScale()*clamp(z,1,ZMAX),0,0,anim);
function toggleFit(){
  prefs.fitW=!prefs.fitW;prefs.setT=Date.now();savePrefs();Sync.kick();
  viewReset('top');syncRowState();
  toast(prefs.fitW?'Страница вписана по ширине экрана':'Страница целиком на экране',1800);
}

async function openReader(c){
  if(!rd.hidden&&R.c&&R.c.id===c.id)return;
  R.c=c;const p=c.progress||{c:0,p:0};
  R.ci=clamp(p.c|0,0,c.chapters.length-1);R.pi=clamp(p.p|0,0,c.chapters[R.ci].pages-1);
  rd.hidden=false;setUI(false);applyBright();R.s=1;R.tx=R.ty=0;img.style.transform='';img.removeAttribute('src');
  await showPage(0,'top');
  if(!prefs.hint){prefs.hint=true;savePrefs();toast('Нажмите по центру экрана, чтобы открыть меню',3400)}
}
function closeReader(){
  if(rd.hidden)return;
  clearTimeout(progT);if(R.c){persistQuiet(R.c);Sync.progress(true)}
  rd.hidden=true;R.tok++;R.c=null;img.removeAttribute('src');pts.clear();G=null;
  try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch{}
}
async function showPage(dir,edge){
  const c=R.c,ci=R.ci,pi=R.pi,tok=++R.tok,ch=c.chapters[ci];
  edge=edge||(dir<0?'bottom':'top');
  $('#rtitle').textContent=c.title;
  $('#rpos').textContent=`Глава ${ci+1} из ${c.chapters.length} · стр. ${pi+1} из ${ch.pages}`;
  $('#rprog').style.width=((pi+1)/ch.pages*100)+'%';
  const t=Date.now();c.progress={c:ci,p:pi,t};prefs.last={id:c.id,t};savePrefs();saveProgressSoon(c);Sync.progress();
  const url=await pageUrl(c,ci,pi);
  if(tok!==R.tok)return;
  if(!url){img.removeAttribute('src');toast('Не удалось загрузить страницу',2600);return}
  if(img.getAttribute('src')!==url)await new Promise(res=>{img.onload=img.onerror=()=>res();img.src=url});
  if(tok!==R.tok)return;
  viewReset(edge);
  if(dir&&img.animate&&!reduceMotion()){const d=dir*(prefs.rtl?-1:1);try{img.animate([{opacity:0,translate:`${d*36}px 0`},{opacity:1,translate:'0 0'}],{duration:190,easing:'ease-out'})}catch{}}
  const nx=pi+1<ch.pages?[ci,pi+1]:ci+1<c.chapters.length?[ci+1,0]:null;
  if(nx)pageUrl(c,nx[0],nx[1]);
}
function snap(){img.style.transition='transform .16s ease';applyT();setTimeout(()=>{img.style.transition=''},180)}
async function step(d){
  const c=R.c;let ci=R.ci,pi=R.pi+d;
  if(pi>=c.chapters[ci].pages){
    if(ci+1<c.chapters.length){ci++;pi=0;toast(c.chapters[ci].title,1600)}else{toast('Это последняя страница',1500);snap();return}
  }else if(pi<0){
    if(ci>0){ci--;pi=c.chapters[ci].pages-1;toast(c.chapters[ci].title,1600)}else{toast('Это первая страница',1500);snap();return}
  }
  R.ci=ci;R.pi=pi;showPage(d,d<0?'bottom':'top');
}
/* keys and wheel: scroll a tall page first, and turn the page only when its end is reached */
function scrollStep(d){
  const b=bounds();
  if(b.my<2){step(d);return}
  const atEnd=d>0?R.ty<=-b.my+1:R.ty>=b.my-1;
  if(atEnd){step(d);return}
  R.ty-=d*stage.clientHeight*.85;img.style.transition=reduceMotion()?'':'transform .18s ease';applyT();
  setTimeout(()=>{img.style.transition=''},200);
}
function nextChapter(){
  const c=R.c;
  if(R.ci+1<c.chapters.length){R.ci++;R.pi=0;showPage(1,'top');toast(c.chapters[R.ci].title,1800)}else toast('Это последняя глава',1600);
}
function readerAct(a){
  switch(a){
    case'rd-close':back('comic-'+R.c.id);break;
    case'rd-left':step(prefs.rtl?1:-1);break;
    case'rd-right':step(prefs.rtl?-1:1);break;
    case'rd-start':R.ci=0;R.pi=0;showPage(-1,'top');toast('С самого начала',1400);break;
    case'rd-bright':{const p=$('#bpanel');$('#zpanel').hidden=true;p.hidden=!p.hidden;syncRowState();break}
    case'rd-zoom':{const p=$('#zpanel');$('#bpanel').hidden=true;p.hidden=!p.hidden;syncZoomUI();break}
    case'rd-fit':toggleFit();break;
    case'rd-zplus':setZoom(zoomOf()*1.5,true);break;
    case'rd-zminus':setZoom(zoomOf()/1.5,true);break;
    case'rd-zreset':setZoom(1,true);break;
    case'rd-nch':nextChapter();break;
  }
}
function readerKey(e){
  if(e.target&&e.target.matches&&e.target.matches('input'))return;       /* let the sliders use the arrow keys themselves */
  const r=prefs.rtl?-1:1;
  if(e.key==='Escape')back('comic-'+R.c.id);
  else if(e.key==='ArrowRight')step(r);
  else if(e.key==='ArrowLeft')step(-r);
  else if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' ')scrollStep(1);
  else if(e.key==='ArrowUp'||e.key==='PageUp')scrollStep(-1);
  else if(e.key==='+'||e.key==='=')setZoom(zoomOf()*1.5,true);
  else if(e.key==='-')setZoom(zoomOf()/1.5,true);
  else if(e.key==='0')setZoom(1,true);
  else if(e.key==='f'||e.key==='F')toggleFit();
  else return;
  e.preventDefault();
}

/* gestures on the page: one finger swipes (or pans when zoomed or when a tall page is fitted to the width), two fingers pinch,
   double tap zooms, tap in the middle toggles the menu. At the end of a tall page one more swipe turns the page. */
const pts=new Map();let G=null,lastTap=0,lastX=0,lastY=0,tapT=0;
const hyp=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const midOf=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
function rel(x,y){const r=stage.getBoundingClientRect();return{x:x-(r.left+r.width/2),y:y-(r.top+r.height/2)}}
function onTap(x,y){
  const now=performance.now();
  if(now-lastTap<300&&Math.hypot(x-lastX,y-lastY)<45){lastTap=0;clearTimeout(tapT);const f=rel(x,y),base=baseScale();zoomTo(R.s>base*1.05?base:base*2.6,f.x,f.y,true);return}
  lastTap=now;lastX=x;lastY=y;clearTimeout(tapT);
  tapT=setTimeout(()=>{
    const r=stage.getBoundingClientRect(),fx=(x-r.left)/r.width,fy=(y-r.top)/r.height;
    if(fx>.25&&fx<.75&&fy>.2&&fy<.8)setUI(!R.ui);else if(R.ui)setUI(false);
  },270);
}
stage.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  try{stage.setPointerCapture(e.pointerId)}catch{}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});img.style.willChange='transform';
  if(pts.size===1){const b=bounds();G={x0:e.clientX,y0:e.clientY,dx:0,dy:0,moved:false,pinch:false,tx0:R.tx,ty0:R.ty,atTop:R.ty>=b.my-1,atBottom:R.ty<=-b.my+1}}
  else if(pts.size===2&&G){
    const[a,b]=[...pts.values()],m=midOf(a,b);
    G.pinch=true;G.d0=hyp(a,b)||1;G.s0=R.s;G.m0=rel(m.x,m.y);G.tx0=R.tx;G.ty0=R.ty;clearTimeout(tapT);img.style.transition='';
  }
});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!G)return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const base=baseScale();
  if(pts.size>=2&&G.pinch){
    const[a,b]=[...pts.values()],m0=midOf(a,b),m=rel(m0.x,m0.y),s=clamp(G.s0*hyp(a,b)/G.d0,base,base*ZMAX);
    R.tx=m.x-s*((G.m0.x-G.tx0)/G.s0);R.ty=m.y-s*((G.m0.y-G.ty0)/G.s0);R.s=s;applyT();
  }else if(pts.size===1){
    G.dx=e.clientX-G.x0;G.dy=e.clientY-G.y0;
    if(Math.hypot(G.dx,G.dy)>10)G.moved=true;
    if(R.s>base*1.03||bounds().my>=2){R.tx=G.tx0+G.dx;R.ty=G.ty0+G.dy;applyT()}
    else if(G.moved&&Math.abs(G.dx)>Math.abs(G.dy))applyT(G.dx*.6);
  }
});
function pointerEnd(e,cancel){
  if(!pts.has(e.pointerId))return;
  pts.delete(e.pointerId);
  if(!G)return;
  if(pts.size>0){const p=[...pts.values()][0];G.x0=p.x;G.y0=p.y;G.tx0=R.tx;G.ty0=R.ty;G.dx=G.dy=0;G.moved=true;return}
  const g=G;G=null;
  setTimeout(()=>{if(!pts.size)img.style.willChange=''},260);
  const base=baseScale();
  if(cancel){snap();return}
  if(g.pinch){if(R.s<base*1.06){R.s=base;R.tx=0;applyT()}return}
  if(R.s>base*1.03){if(!g.moved)onTap(e.clientX,e.clientY);return}           /* zoomed in: dragging only pans */
  const b=bounds();
  if(g.moved&&b.mx<2&&Math.abs(g.dx)>55&&Math.abs(g.dx)>Math.abs(g.dy)*1.2){applyT();step((g.dx<0?1:-1)*(prefs.rtl?-1:1));return}
  if(g.moved&&b.my>=2&&Math.abs(g.dy)>60&&Math.abs(g.dy)>Math.abs(g.dx)*1.2){
    if(g.dy<0&&g.atBottom){step(1);return}
    if(g.dy>0&&g.atTop){step(-1);return}
  }
  snap();
  if(!g.moved)onTap(e.clientX,e.clientY);
}
stage.addEventListener('pointerup',e=>pointerEnd(e,false));
stage.addEventListener('pointercancel',e=>pointerEnd(e,true));
let wheelT=0;
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  if(!e.ctrlKey&&baseScale()>1&&zoomOf()<1.03){                                          /* a fitted tall page scrolls with the wheel */
    const n=performance.now();if(n-wheelT<260)return;wheelT=n;scrollStep(e.deltaY>0?1:-1);return}
  const f=rel(e.clientX,e.clientY);zoomTo(R.s*(e.deltaY<0?1.18:1/1.18),f.x,f.y,false);
},{passive:false});
stage.addEventListener('contextmenu',e=>e.preventDefault());
/* a turned phone or a collapsing address bar changes the stage size: keep the loupe value and the place on the page */
if(window.ResizeObserver)new ResizeObserver(()=>{if(rd.hidden||!img.naturalWidth)return;R.s=baseScale()*(R.z||1);applyT()}).observe(stage);

/* ───────── saving files, downloads with progress ───────── */
const safeName=(s,d='comic')=>String(s||d).replace(/[\\/:*?"<>|\u0000-\u001F]+/g,' ').replace(/\s+/g,' ').trim().slice(0,90)||d;
const extOf=type=>({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/avif':'avif','image/bmp':'bmp'})[type]||'jpg';
const mb=n=>(n/1048576).toFixed(n>=10485760?0:1)+' МБ';
const MAX_DL=500*1048576;
async function saveBlob(blob,name){
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch{dl=null}
  if(dl){
    const asZip=/\.cbz$/i.test(name),fn=asZip?name.replace(/\.cbz$/i,'.zip'):name;   /* the preview only allows a fixed set of file types */
    try{await dl.save({filename:fn,data:blob});toast(asZip?'Сохранено как .zip. Это тот же архив: переименуйте в .cbz, если нужно':'Файл сохранён',3200);return true}
    catch(e){toast(e&&e.code==='declined'?'Сохранение отменено':'Не удалось сохранить файл',2600);return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);toast('Файл готов, смотрите загрузки браузера',2800);return true;
}
function busy(title,sub=''){
  openSheet(`<div class="sh-h"><h3>${esc(title)}</h3></div><p id="busyText" class="mut">${esc(sub)}</p><div class="prog"><div id="busyBar"></div></div>`,{lock:true});
}
const netErr=e=>e&&e.name==='TypeError'?'нет связи или сайт не разрешает загрузку со страниц (CORS)':(e&&e.message)||'ошибка';
async function fetchBlob(url,opts,onProg){
  const r=await fetch(url,opts||{});
  if(!r.ok)throw new Error('сервер ответил '+r.status);
  const total=+r.headers.get('content-length')||0;
  if(total>MAX_DL)throw new Error('файл больше 500 МБ');
  if(!onProg||!r.body||!r.body.getReader)return await r.blob();
  const rd=r.body.getReader(),parts=[];let got=0;
  for(;;){
    const{done,value}=await rd.read();if(done)break;
    parts.push(value);got+=value.length;
    if(got>MAX_DL){try{rd.cancel()}catch{}throw new Error('файл больше 500 МБ')}
    onProg(got,total);
  }
  return new Blob(parts,{type:r.headers.get('content-type')||''});
}
async function isZip(blob){
  const b=new Uint8Array(await blob.slice(0,4).arrayBuffer());
  return b[0]===0x50&&b[1]===0x4B&&(b[2]===3||b[2]===5);
}
/* download an archive, check that it really is a zip/cbz, unpack it into the library */
async function pullArchive(url,name,o={}){
  const label=o.label||name;
  if(!o.quiet)busy('Скачиваю…',label);
  const px=o.proxy&&proxyOn();
  let blob;
  try{blob=await fetchBlob(px?viaProxy(url):url,px?{headers:proxyHeaders()}:o.fetchOpts,(got,total)=>{if(!o.quiet)setBusy(`${label} — ${mb(got)}${total?' из '+mb(total):''}`,total?got/total:.3)})}
  catch(e){
    /* the browser refused to read the file from a web page (CORS) or the network dropped: remember what to offer as a manual download */
    if(e&&e.name==='TypeError')e.manual={name,url,size:o.size||0,id:o.id||null,extra:o.extra||{},fallback:o.fallback||{}};
    throw e;
  }
  if(!await isZip(blob))throw new Error('это не архив CBZ или ZIP (форматы RAR и CBR пока не поддерживаются)');
  if(!o.quiet){setBusy('Распаковываю…',1);await wait(0)}

/* ───────── Internet Archive: legal search and download ───────── */
const IA='https://archive.org';
const LIC_OK=/creativecommons\.org|publicdomain|\/cc0|unlicense/i;
function licLabel(url){
  const m=/creativecommons\.org\/licenses\/([a-z-]+)\/?([\d.]*)/i.exec(url);
  if(m)return('CC '+m[1].toUpperCase()+' '+m[2]).trim();
  if(/publicdomain\/zero|cc0/i.test(url))return'CC0';
  if(/publicdomain/i.test(url))return'Общественное достояние';
  return'Свободная лицензия';
}
function iaLegal(d){
  const lic=[].concat(d.licenseurl||[]).join(' '),st=String(d['possible-copyright-status']||'');
  if(LIC_OK.test(lic))return{ok:true,label:licLabel(lic)};
  if(/NOT_IN_COPYRIGHT|public domain/i.test(st))return{ok:true,label:'Общественное достояние'};
  return{ok:false,label:'Нет свободной лицензии'};
}
async function iaSearch(q,page){
  const text=q.replace(/[()"\\:]/g,' ').replace(/\s+/g,' ').trim()||'comics';
  const base=`(${text}) AND mediatype:texts AND format:"Comic Book ZIP"`;
  const legal=` AND (licenseurl:(*creativecommons* OR *publicdomain*) OR possible-copyright-status:NOT_IN_COPYRIGHT)`;
  const fl=['identifier','title','creator','year','licenseurl','possible-copyright-status'].map(f=>`fl%5B%5D=${encodeURIComponent(f)}`).join('&');
  const url=query=>`${IA}/advancedsearch.php?q=${encodeURIComponent(query)}&${fl}&rows=20&page=${page}&sort%5B%5D=downloads+desc&output=json`;
  let j=null;
  try{const r=await fetch(url(base+legal));if(r.ok){j=await r.json();if(j.error||!j.response)j=null}}catch(e){if(e.name==='TypeError')throw e}
  if(!j){const r=await fetch(url(base));if(!r.ok)throw new Error('Internet Archive ответил '+r.status);j=await r.json()}   /* fall back to a plain query and filter by licence here */
  const docs=(j.response?.docs||[]).map(d=>Object.assign({id:d.identifier,title:[].concat(d.title||d.identifier).join(' '),author:[].concat(d.creator||[]).join(', '),year:String(d.year||'')},iaLegal(d)));
  return{docs,total:j.response?.numFound||0};
}
const stripHtml=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
async function iaFetch(it,folder){
  busy('Ищу файл…',it.title||it.id);
  const r=await fetch(`${IA}/metadata/${encodeURIComponent(it.id)}`);
  if(!r.ok)throw new Error('запись не найдена ('+r.status+')');
  const meta=await r.json(),md=meta.metadata||{};
  const lg=iaLegal(md);
  if(!lg.ok)throw new Error('у записи нет свободной лицензии, скачивание отключено. Откройте её на archive.org');
  const files=(meta.files||[]).filter(f=>/\.cbz$/i.test(f.name)||/comic book zip/i.test(f.format||''));
  if(!files.length)throw new Error('в записи нет файла CBZ');
  files.sort((a,b)=>(a.source==='original'?0:1)-(b.source==='original'?0:1)||(+a.size||0)-(+b.size||0));
  const f=files[0],fname=f.name.split('/').pop(),size=+f.size||0;
  if(size>MAX_DL)throw new Error('файл больше 500 МБ');
  const url=`${IA}/download/${encodeURIComponent(it.id)}/${f.name.split('/').map(encodeURIComponent).join('/')}`;
  const subj=[].concat(md.subject||[]).join(';').split(/[;,]/).map(s=>s.trim()).filter(Boolean);
  const fallback={title:[].concat(md.title||it.title||'').join(' ').trim(),author:[].concat(md.creator||it.author||[]).join(', '),year:String(md.year||md.date||it.year||'').slice(0,4),
    desc:stripHtml([].concat(md.description||[]).join(' ')).slice(0,1500),tags:subj.slice(0,8)};
  return await pullArchive(url,fname,{label:fallback.title||fname,size,extra:{folder,source:'web',srcUrl:`${IA}/details/${it.id}`,license:lg.label},fallback});
}
/* ───────── fallback: the server does not let a web page read the file (CORS) ─────────
   A normal browser download still works, so the person saves the file and picks it here; it is then unpacked exactly like a direct download. */
const normName=n=>String(n||'').toLowerCase().replace(/\s*\(\d+\)(?=\.[^.]+$)/,'');
function manualFallback(e,folder,what){
  if(!(e&&e.manual))return false;

}
